<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id = "weather-wrapper">
            <h1>WEATHER APP</h1>
            <div id="weather-search">
                <input id="search" type="text" placeholder="Enter location" />
                <button id="submit" type="button" onclick="fetchweather()">Search</button>
            </div>
            <div id="weather-data" style="display: none;"></div>
        </section>
    </main>
     
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
